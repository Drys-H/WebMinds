spring.application.name=backend
server.port=8080

# MS SQL Database Connection
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WMR;encrypt=true;trustServerCertificate=true;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WMR;integratedSecurity=true;encrypt=true;trustServerCertificate=true;
#spring.datasource.username=
#spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Configuration
# 'update' automatically creates/updates database tables based on our Java classes!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2016Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Custom JWT Secret Key (Keep this long and complex)
jwt.secret=mySuperSecretRecipeAppKeyThatNeedsToBeVeryLongToWorkProperlyWithHS256Algorithm
jwt.expiration=86400000