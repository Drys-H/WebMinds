spring.application.name=backend
# Server Port (React usually runs on 3000, so we run backend on 8080)
server.port=8080

# MS SQL Database Connection
# We will update "YOUR_DATABASE_NAME" when we set up MS SQL in Phase 3
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RecipeAppDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=YOUR_STRONG_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Configuration
# 'update' automatically creates/updates database tables based on our Java classes!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2016Dialect

# Custom JWT Secret Key (Keep this long and complex)
jwt.secret=mySuperSecretRecipeAppKeyThatNeedsToBeVeryLongToWorkProperlyWithHS256Algorithm
jwt.expiration=86400000